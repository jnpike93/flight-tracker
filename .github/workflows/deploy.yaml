name: Deploy Flight Tracker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check Deployment Secrets
        run: |
          echo "Verifying deployment configuration..."
          ERRORS=0
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "::error::Missing GitHub Actions Secret: SERVER_HOST. Please add it in Settings -> Secrets and variables -> Actions"
            ERRORS=1
          else
            echo "SERVER_HOST is configured."
          fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then
            echo "::error::Missing GitHub Actions Secret: SERVER_USER. Please add it in Settings -> Secrets and variables -> Actions"
            ERRORS=1
          else
            echo "SERVER_USER is configured."
          fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Missing GitHub Actions Secret: SSH_PRIVATE_KEY. Please add it in Settings -> Secrets and variables -> Actions"
            ERRORS=1
          else
            echo "SSH_PRIVATE_KEY is configured."
          fi
          if [ "$ERRORS" -eq 1 ]; then
            exit 1
          fi

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2323 # Custom SSH port
          script: |
            set -e

            echo "=== 1. Navigating to Flight Tracker directory ==="
            cd /opt/flight-tracker

            echo "=== 2. Fetching and syncing latest code and built assets from main ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== 3. Installing lightweight backend dependencies ==="
            npm ci --omit=dev

            echo "=== 4. Ensuring airport database is seeded ==="
            node server/seed_airports.js

            echo "=== 5. Restarting backend service with PM2 ==="
            pm2 restart flight-tracker || pm2 start ecosystem.config.js --env production
            pm2 save

            echo "=== 6. Ensuring legal compliance and assets are available on default web roots ==="
            for WEB_DIR in /var/www/html /var/www/cuteanimegirls.moe /var/www/default; do
              if [ -d "$WEB_DIR" ]; then
                echo "Syncing legal compliance files to $WEB_DIR..."
                cp /opt/flight-tracker/client/dist/privacy.html "$WEB_DIR/privacy.html" 2>/dev/null || true
                cp /opt/flight-tracker/client/dist/termsofservice.html "$WEB_DIR/termsofservice.html" 2>/dev/null || true
                cp /opt/flight-tracker/client/dist/logo-120.png "$WEB_DIR/logo-120.png" 2>/dev/null || true
                cp /opt/flight-tracker/client/dist/logo-512.png "$WEB_DIR/logo-512.png" 2>/dev/null || true
                cp /opt/flight-tracker/client/dist/privacy.html "$WEB_DIR/privacy" 2>/dev/null || true
                cp /opt/flight-tracker/client/dist/termsofservice.html "$WEB_DIR/termsofservice" 2>/dev/null || true

                if [ -f "$WEB_DIR/index.html" ]; then
                  if ! grep -q "Privacy Policy" "$WEB_DIR/index.html"; then
                    echo "Adding AeroLog legal navigation banner to $WEB_DIR/index.html..."
                    sed -i 's|<body[^>]*>|&<div style="background:#020617;color:#fff;padding:14px;font-family:sans-serif;text-align:center;border-bottom:1px solid #1e293b;font-size:13px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;"><span>✈️ <strong>AeroLog Global Flight Tracker</strong></span><a href="https://flights.cuteanimegirls.moe" style="color:#38bdf8;text-decoration:underline;">Launch Application</a><a href="/privacy" style="color:#38bdf8;text-decoration:underline;">Privacy Policy</a><a href="/termsofservice" style="color:#38bdf8;text-decoration:underline;">Terms of Service</a></div>|' "$WEB_DIR/index.html" || true
                  fi
                fi
              fi
            done

            echo "=== Deployment Complete! ==="

